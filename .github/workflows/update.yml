name: Generate Badges

on:
  workflow_dispatch:
    inputs:
      project:
        description: "SonarQube project key"
        required: true
        type: string

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        run: sudo apt-get install python3 python3-pip -y

      - name: Install dependencies
        run: pip3 install requests

      - name: Generate Badges
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          python3 scripts/generate_badges.py "${{ inputs.project }}"

      - name: Commit and Push badges
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add "badges/${{ inputs.project }}"/*.svg

          if git commit -m "Update Sonar badges for ${{ inputs.project }}"; then
            # Pull with rebase to handle concurrent runs
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
